<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livre Chabat — illustrations</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fond:#f7f1e6;--carte:#fffdf8;--encre:#2b1f1a;--doux:#7a6a5c;--or:#b8862b;--ligne:#e6dccb;--ok:#3f7d4e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fond:#17130f;--carte:#221c16;--encre:#f3ead9;--doux:#b9a993;--or:#d9a94a;--ligne:#3a3026;--ok:#79b98a}}
:root[data-theme="dark"]{--fond:#17130f;--carte:#221c16;--encre:#f3ead9;--doux:#b9a993;--or:#d9a94a;--ligne:#3a3026;--ok:#79b98a}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--fond);color:var(--encre);font:16px/1.55 Inter,system-ui,sans-serif}
header{padding:48px 16px 24px;max-width:1180px;margin:auto}
.surtitre{letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--or);font-weight:600}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(30px,6vw,52px);line-height:1.05;margin:10px 0 12px}
.sous{color:var(--doux);max-width:640px;margin:0}
.etat{margin-top:22px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.jauge{flex:1 1 260px;height:10px;background:var(--ligne);border-radius:99px;overflow:hidden}
.jauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--or),#e3b961);transition:width .8s}
.compte{font-weight:600}.maj{color:var(--doux);font-size:14px}
main{max-width:1180px;margin:auto;padding:8px 16px 64px;display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
figure{margin:0;background:var(--carte);border:1px solid var(--ligne);border-radius:14px;overflow:hidden;cursor:zoom-in;transition:transform .25s,box-shadow .25s}
figure:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(60,40,20,.45)}
figure img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--ligne)}
figcaption{padding:12px 14px 14px}
.num{font-size:12px;letter-spacing:.12em;color:var(--or);font-weight:600}
.titre{font-family:Fraunces,Georgia,serif;font-size:18px;line-height:1.25;margin-top:2px}
.nouveau{display:inline-block;margin-left:6px;font-size:11px;color:var(--ok);font-weight:600}
.vide{grid-column:1/-1;color:var(--doux)}
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,820px)}
dialog::backdrop{background:rgba(20,14,10,.82)}
dialog img{width:100%;height:auto;max-height:86vh;object-fit:contain;border-radius:10px;display:block}
dialog p{color:#f3ead9;text-align:center;font-family:Fraunces,Georgia,serif;margin:10px 0 0}
footer{text-align:center;color:var(--doux);font-size:13px;padding:0 16px 40px}
</style>
</head>
<body>
<header>
 <div class="surtitre">Livre « Chabat » · Avraham Ghezi</div>
 <h1>Les illustrations, page par page</h1>
 <p class="sous">Chaque image suit votre consigne de dessin. Cette page se met à jour toute seule : les nouvelles illustrations apparaissent dès qu'elles sont prêtes et vérifiées.</p>
 <div class="etat"><div class="jauge"><i id="jauge"></i></div><span class="compte" id="compte">…</span><span class="maj" id="maj"></span></div>
</header>
<main id="grille"><p class="vide">Chargement…</p></main>
<dialog id="zoom"><img id="zimg" alt=""><p id="ztxt"></p></dialog>
<footer>Touchez une image pour l'agrandir.</footer>
<script>
const g=document.getElementById('grille'),z=document.getElementById('zoom');
z.addEventListener('click',()=>z.close());
let vu=new Set(JSON.parse(sessionStorage.getItem('vu')||'[]'));
async function charger(){
 try{
  const r=await fetch('manifest.json?t='+Date.now(),{cache:'no-store'});const m=await r.json();
  document.getElementById('compte').textContent=m.pages.length+' / '+m.total+' pages illustrées';
  document.getElementById('jauge').style.width=(100*m.pages.length/m.total)+'%';
  document.getElementById('maj').textContent='Mis à jour le '+m.maj;
  g.innerHTML='';
  if(!m.pages.length){g.innerHTML='<p class="vide">Les premières pages arrivent.</p>';return}
  for(const p of m.pages){
   const f=document.createElement('figure');const neuf=!vu.has(p.fichier)&&vu.size>0;
   f.innerHTML=`<img loading="lazy" src="img/${p.fichier}?v=${p.v}" alt="Page ${p.page} : ${p.titre}"><figcaption><div class="num">PAGE ${p.page}${neuf?'<span class="nouveau">● nouvelle</span>':''}</div><div class="titre">${p.titre}</div></figcaption>`;
   f.onclick=()=>{document.getElementById('zimg').src='img/'+p.fichier+'?v='+p.v;document.getElementById('ztxt').textContent='Page '+p.page+' — '+p.titre;z.showModal()};
   g.appendChild(f)}
  m.pages.forEach(p=>vu.add(p.fichier));try{sessionStorage.setItem('vu',JSON.stringify([...vu]))}catch(e){}
 }catch(e){}
}
charger();setInterval(charger,60000);
</script>
</body>
</html>
